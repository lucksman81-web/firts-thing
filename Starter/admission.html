<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: lightyellow;
        }
        .main {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .title {
            color: black;
            font-size: 38px;
            text-align: center;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .card {
            background: white;
            padding: 35px;
            border: 3px solid black;
            border-radius: 16px;
        }
        .heading {
            margin-bottom: 25px;
            color: black;
            font-size: 24px;
            text-align: center;
            font-weight: 700;
        }
        .box {
            margin-bottom: 20px;
        }
        .box label {
            display: block;
            margin-bottom: 8px;
            color: black;
            font-size: 14px;
            font-weight: 600;
        }
        .field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid black;
            border-radius: 10px;
            font-size: 14px;
            background-color: white;
            color: black;
        }
        .field:focus {
            border-color: black;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: lightskyblue;
            color: black;
            border: 2px solid black;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover {
            background: #0369a1;
            color: white;
        }
        .link-text {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            color: #64748b;
        }
        .link-text a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
        }
        .link-text a:hover {
            text-decoration: underline;
        }
       
        
    </style>
</head>
<body>
    <div class="main">
      
        <h3 class="title">Lucksman's Sports</h3>
        <div class="card">
         
            <h2 class="heading">Register Here</h2>
            <form>
                <div class="box">
                    <label for="usernme">Full Name</label>
                    <input type="text" id="username" class="field" placeholder="Enter your full name">
                </div>
                <div class="box">
                    <label for="position">WHAT SPORTS DO YOU LIKE</label>
                    <select id="position" class="field">
                        <option value="" disabled selected>Select your position</option>
                        <option value="VOLLEYBALL">VOLLEYBALL</option>
                        <option value="football">FOOTBALL</option>
                        <option value="cricket">CRICKET</option>
                        <option vaule="kabaddi">KABADDI</option>
                        <option value="athletes">ATHLETES</option>
                        <option value="basketball">BASKETBALL</option>
                    </select>
                </div>
                <div class="box">
                    <label for="district">Contact</label>
                    <input type="text" id="contact" class="field" placeholder="Enter your Contact" >
                </div>
                <div class="box">
                    <label for="contact">Your feedback</label>
                    <input type="tel" id="text" class="field" placeholder="Enter your Your feedback">
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
            <div class="link-text">Go to Home Page<a href="C:\Users\RohitLucksmanArivazh\Desktop\HTML FOLDER\Starter\home_page.html" <br>   Return Back</a></div>

        </div>
    </div>
</body>
</html>
